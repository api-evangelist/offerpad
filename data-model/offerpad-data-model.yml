hateoas:
  note: >-
    Every resource carries an _links object with self, collection, about, author,
    wp:featuredmedia, wp:attachment, wp:term and replies relations; _embed expands them into
    _embedded. Confirmed in examples/offerpad-wp-v2-posts-response.json.
absent:
  note: >-
    No property, listing, offer, valuation, contract, escrow, renovation or transaction entity
    is exposed on any public Offerpad surface. The private helix backend implies such entities
    (cash-offer-transactions, contracts, documents, forms, offers) but publishes no schema —
    see helix/offerpad-helix-observed-endpoints.yml.
