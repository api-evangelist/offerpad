        required: true
        schema:
          type: string
        description: Unique registered name for the block.
      - name: context
        schema:
          type: string
          enum: &id004
          - edit
          default: view
        required: false
        description: Scope under which the request is made; determines fields present in response.
        in: query
      - name: attributes
        schema:
          type: object
          default: &id005 []
        required: false
        description: Attributes for the block.
        in: query
      - name: post_id
        schema:
          type: integer
        required: false
        description: ID of the post context.
        in: query
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        '400': *id001
        '401': *id002
        '404': *id003
    post:
