openapi: 3.1.0
info:
  title: Offerpad WordPress REST API (wp/v2)
  version: 2.0.0
  summary: The wp/v2 namespace of the WordPress REST API served by Offerpad's marketing site.
  description: DERIVED, NOT PUBLISHED BY OFFERPAD. Offerpad publishes no OpenAPI definition and does not document
    or support this surface as a developer product. This document was derived mechanically by API Evangelist from
    the live WordPress route-discovery document fetched from https://www.offerpad.com/wp-json/ on 2026-07-26 (411
    routes across 20 namespaces; the wp/v2 namespace is captured here). Every path, method, parameter name, type,
    enum, default and description is copied verbatim from that discovery document. Response bodies are intentionally
    left as generic objects because the discovery document does not publish response schemas; error responses are
    grounded in payloads probed live against this host. This is a content-management surface for the marketing site
    - it is NOT a real estate, listing, valuation or transaction API.
  contact:
    name: Offerpad
    url: https://www.offerpad.com/contact/
  x-apievangelist-method: derived
  x-apievangelist-source: openapi/offerpad-wp-json-discovery.json
  x-apievangelist-derived: '2026-07-26'
  x-upstream-documentation: https://developer.wordpress.org/rest-api/
