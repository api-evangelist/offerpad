name: Offerpad
kind: company
description: >-
  Offerpad Solutions Inc. (NYSE: OPAD), headquartered in Chandler, Arizona, is a
  United States iBuyer and licensed residential real estate brokerage that buys
  homes directly from sellers for cash, renovates them, and resells them, while
  also offering traditional listing services, a free local move, and a Renovate
  service. It sits in the middle of the US residential value chain as a
  principal-position buyer and MLS-participating brokerage in seventeen states,
  consuming licensed MLS listing data rather than publishing it. Offerpad's API
  posture is honestly minimal: there is no developer portal, no published API
  documentation, and no self-serve API access of any kind. The developer.,
  developers., api. and docs. subdomains do not resolve, and /developers, /api,
  /docs, /openapi.json, /swagger.json and /api-docs all return 404. Offerpad is
  NOT listed in the RESO certification directory, holds no RESO Web API or Data
  Dictionary certification, and serves no OData service document, $metadata
  document, or Universal Property Identifier. Its partner surfaces — the
  Direct+ investor-buyer program, the Powered By Offerpad agent partner portal,
  the homebuilder program and the vendor network — are human web portals gated
  behind an intake form and a Mutual Non-Disclosure Agreement, with no
  programmatic interface described anywhere. The only publicly callable,
  self-describing API on the domain is the stock WordPress REST API of the
  marketing site.
