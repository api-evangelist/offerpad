apis:
  - aid: offerpad:offerpad-wordpress-rest-api
    name: Offerpad WordPress REST API
    description: >-
      The stock WordPress REST API served by Offerpad's WP Engine-hosted
      marketing site at https://www.offerpad.com/wp-json/. Confirmed live and
      anonymously readable on 2026-07-26 (HTTP 200, application/json, 387,532
      bytes), the root discovery document self-describes 411 routes across 20
      namespaces including wp/v2, yoast/v1, gf/v2 (Gravity Forms),
      redirection/v1 and elementor/v1, and advertises WordPress application
      passwords as its authentication scheme. This is a content-management
      surface for pages, posts, media and site metadata — it is NOT a real
      estate, listing, valuation or transaction API, and Offerpad does not
      document or support it as a developer product. It is catalogued here
      because it is the only publicly callable, machine-describable API found
      on any Offerpad host.
    humanURL: https://developer.wordpress.org/rest-api/
    baseURL: https://www.offerpad.com/wp-json
    tags:
      - CMS
      - Content
      - WordPress
      - Marketing Site
    properties:
      - type: OpenAPI
        name: >-
          Offerpad WordPress REST API (wp/v2) — derived by API Evangelist from the live route
          discovery document; Offerpad publishes no OpenAPI
        url: openapi/offerpad-wordpress-wp-v2-openapi.yml
      - type: Discovery
        name: WordPress route discovery document, saved verbatim (411 routes, 20 namespaces)
        url: openapi/offerpad-wp-json-discovery.json
      - type: Overlay
        name: API Evangelist enhancements overlay
        url: overlays/offerpad-wordpress-wp-v2-overlay.yaml
      - type: Examples
        name: Real captured responses from the live API
        url: examples/_index.yml
      - type: DataModel
        name: Entity-relationship graph derived from the route discovery document
        url: data-model/offerpad-data-model.yml
      - type: Documentation
        name: Upstream WordPress REST API handbook (Offerpad publishes none of its own)
        url: https://developer.wordpress.org/rest-api/
  - aid: offerpad:offerpad-helix-api
    name: Offerpad Helix API (private customer backend)
    description: >-
      Offerpad's real transaction API, and it is closed. Discovered on 2026-07-26 as the API_URL
      constant compiled into the Offerpad Connect single-page-app bundle at
      https://connect.offerpad.com/bundle.js, the host at https://helix.offerpad.com serves the
      customer identity, cash-offer transaction, contract, document, form and device endpoints
      that the Offerpad Connect web portal and the Offerpad mobile apps call. It is entirely
      undocumented: there is no developer portal, no reference, no schema and no public client
      registration, and every path except /.well-known/oauth-authorization-server returns
      {"statusCode":404,"message":"Resource not found"} to an anonymous caller. That one live
      discovery document is a conformant RFC 8414 authorization-server metadata document
      delegating to an Okta custom authorization server, which is why Offerpad's identity layer
      is machine-discoverable while none of its business capability is. Catalogued as evidence
      that the capability exists and is deliberately closed, not absent — the observed endpoint
      inventory is recorded verbatim from the first-party client with no schemas inferred.
    humanURL: https://connect.offerpad.com/auth/login
    baseURL: https://helix.offerpad.com
    tags:
      - Private API
      - iBuyer
      - Real-Estate
      - Transaction
      - Undocumented
    tags_raw:
      - Private API
      - iBuyer
      - Real Estate
      - Transactions
      - Undocumented
    properties:
      - type: EndpointInventory
        name: Observed endpoints, recorded from the first-party client bundle
        url: helix/offerpad-helix-observed-endpoints.yml
      - type: WellKnown
        name: RFC 8414 authorization server metadata (live, anonymous)
        url: well-known/offerpad-helix-oauth-authorization-server.json
      - type: Authentication
        name: Auth profile for both Offerpad API surfaces
        url: authentication/offerpad-authentication.yml
      - type: Portal
        name: Offerpad Connect (the client for this backend)
        url: https://connect.offerpad.com/auth/login
