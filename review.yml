strengths:
  - Serves a real, anonymously fetchable llms.txt for agent consumers.
  - Publishes a complete Yoast sitemap index, making the public surface enumerable.
  - Brokerage licensing is disclosed per-entity and per-state at /licenses/.
  - Partner programme terms (referral percentages, fees, tiers) are stated publicly.

weaknesses:
  - No developer portal, no API documentation, no API of any kind for real estate data.
  - Not RESO certified and no OData, $metadata or UPI surface.
  - No SDK, no webhooks, no Postman collection, no status page, no security.txt.
  - Direct+ portal link on the live onboarding page points at a domain with no A record.
  - The agent portal domain named in Offerpad's own press release (offerpad.pro) is parked with an expired certificate.
  - Partner surfaces are NDA-gated web forms, so nothing is machine-consumable.
  - Bot protection returns 403 on several first-party hosts, hindering automated discovery.

