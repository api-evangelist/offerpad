aid: offerpad
name: Offerpad
reviewed: '2026-07-26'
reviewer:
  fn: Kin Lane
  email: kin@apievangelist.com
  url: https://apievangelist.com
homeMarket: United States
tier: ibuyer
status: built-stub
statusReason: >-
  Identity captured and every plausible developer surface probed. Offerpad
  publishes no developer portal, no API documentation, no SDK, no webhooks and
  no machine-readable contract for any real estate capability. The single
  publicly callable, self-describing API found on any Offerpad host is the
  stock WordPress REST API of the WP Engine-hosted marketing site, which is a
  CMS surface rather than a real estate developer surface.

summary: >-
  Offerpad Solutions Inc. (NYSE: OPAD) is a US iBuyer and licensed residential
  brokerage operating in seventeen states. It buys homes for cash, renovates
  and resells them, lists homes as a brokerage, runs a Renovate service, and
  operates four human partner programs — the Agent Partnership Program /
  Powered By Offerpad, the Direct+ investor-buyer program, homebuilder
  services, and a renovation vendor network. All four are web forms and
  login-gated portals with no programmatic interface. Offerpad announced two
  internal AI platforms, SCOUT (seller intake and routing) and HENRY
  (portfolio intelligence with computer-vision renovation estimating), on
  2026-03-18; both are explicitly internal systems with no external API,
  developer program, or data-integration story.

# ---------------------------------------------------------------------------
# THE POINT OF THE EXERCISE: certification is not reachability
# ---------------------------------------------------------------------------
sectorPosture:
  homeMarket: United States

  resoPosture:
    verbatim: >-
      No RESO reference of any kind exists on Offerpad's public surfaces, and
      Offerpad does not appear in the RESO certification directory. Offerpad
      holds no RESO Web API certification and no RESO Data Dictionary
      certification at any version. It serves no OData service document, no
      $metadata CSDL document, and makes no reference to the RESO Universal
      Property Identifier (UPI). Offerpad is a CONSUMER of MLS data as a
      licensed MLS-participating brokerage, not a certified data PROVIDER, so
      the RESO mandate that NAR imposes on Multiple Listing Services simply
      does not attach to it. This is a case where certification is absent
      rather than a case where certification exists but is unreachable.
    resoCertified: false
    webApiCertified: false
    dataDictionaryCertified: false
    dataDictionaryVersion: null
    odataEndpoint: null
    metadataDocument: null
    upiSupport: false
    directoryEvidence:
      - url: https://www.reso.org/certificates/
        fetched: '2026-07-26'
        status: 200
        bytes: 416233
        finding: >-
          Full RESO certificates directory page fetched and grepped
          case-insensitively. Zero occurrences of "Offerpad". For calibration
          the same document returned zero occurrences of "Opendoor",
          "Redfin" and "Compass", and one occurrence of "Zillow" — consistent
          with a directory of MLSs, pooled platforms, technology companies,
          commercial providers and a small number of brokerages, in which no
          iBuyer appears.
      - url: https://www.reso.org/certification/
        fetched: '2026-07-26'
        status: 200
        finding: >-
          Confirms the directory of certified organizations lives at
          https://www.reso.org/certificates/ and that certification is tracked
          for Web API Core 2.0.0, Data Dictionary 2.0 and RESO Common Format.
      - url: https://certification.reso.org/
        fetched: '2026-07-26'
        status: 400
        finding: >-
          RESO's live certification report host returned HTTP 400 to an
          anonymous root request; the public certificates page was used
          instead.
    siteEvidence: >-
      Case-insensitive searches for "RESO", "OData", "$metadata", "IDX", "VOW",
      "Data Dictionary" and "UPI" across www.offerpad.com pages fetched during
      this review (home, /about/, /agents/, /pbo/, /builders/, /hba/,
      /vendors/, /licenses/, /dplusonboarding/) produced no hits. The
      /licenses/ page enumerates brokerage entities and states only — no MLS,
      IDX, VOW or data-licensing language appears on it.

  accessGate:
    classification: none-published
    reason: >-
      There is no published path by which a developer obtains API access to
      Offerpad — no portal, no key request, no application form, no partner API
      tier, no contact address for API access. The gate is not "closed", it is
      "absent". The nearest analogues are business programs, not developer
      programs.
    whatADeveloperMustSignOrJoin: >-
      Nothing, because nothing is on offer. For the adjacent BUSINESS programs:
      Offerpad Direct+ (the investor-buyer program) requires three steps
      quoted verbatim from https://www.offerpad.com/dplusonboarding/ — "Create
      an account in the Offerpad Direct+ portal. Complete and submit the member
      intake form below. Sign our Mutual Non-Disclosure Agreement." The Agent
      Partnership Program requires no membership or sign-up fee, but requires
      a licensed real estate agent or broker to be identified in the offer
      request; Powered By Offerpad Pro and Max tiers are the portal-bearing
      levels. Homebuilder services and the vendor network are contact forms
      only. None of these agreements grants, or even mentions, data or API
      access.
    portalsObserved:
      - url: https://connect.offerpad.com/auth/login
        status: 200
        note: >-
          Offerpad Connect — a login-gated single-page application. This is the
          live partner/customer portal that portal.offerpad.com redirects to.
          Registration is not open evaluation; it is tied to the programs above.
      - url: https://offerpad.direct/start/
        status: 000
        note: >-
          The Direct+ portal link published on /dplusonboarding/ DOES NOT
          RESOLVE. offerpad.direct has AWS Route 53 nameservers
          (ns-212.awsdns-26.com and three siblings) but no A record. A dead
          link on a live onboarding page.
      - url: https://www.offerpad.pro/start/
        status: 200 (TLS invalid)
        note: >-
          The Powered By Offerpad agent portal URL named in Offerpad's own
          2024 launch press release now resolves to 103.224.182.211, a domain
          parking address, and presents an EXPIRED Let's Encrypt certificate
          issued to CN=strategicts.net (notAfter 2024-09-19). The domain
          appears to have lapsed out of Offerpad's control. Recorded as an
          observed fact, not as a working portal.
      - url: https://direct.offerpad.com/
        status: 403
        note: Redirects to https://buy.offerpad.com/investor/landing; blocked to non-browser clients.

  openData:
    available: false
    note: >-
      Offerpad publishes no open dataset. It is a private US market
      participant; there is no US federal or state counterweight equivalent to
      HM Land Registry Price Paid or Ordnance Survey open products, and
      Offerpad publishes nothing under an open licence. The only unlicensed,
      anonymously fetchable structured data on the domain is its own marketing
      content (sitemaps, llms.txt, the WordPress REST API).

  authModel:
    publishedApiAuth: none
    detail: >-
      No API authentication scheme is published because no API is published.
      /.well-known/openid-configuration returns 404 on www.offerpad.com and is
      swallowed by the SPA catch-all on connect.offerpad.com (HTML, not JSON) —
      no OpenID Connect discovery document is served anywhere. The Offerpad
      Connect portal uses a conventional form login at /auth/login with no
      exposed identity-provider configuration; the login page loads only
      Iubenda consent, Salesforce Live Agent / Embedded Service, and a local
      /bundle.js, with no Auth0, Okta, Cognito, Firebase or MSAL markers. The
      one real auth statement found anywhere is in the WordPress REST API root
      document, which advertises WordPress application passwords with an
      authorization endpoint at
      https://www.offerpad.com/wp-admin/authorize-application.php.

